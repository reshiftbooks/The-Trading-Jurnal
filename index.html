<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Journal</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#16181d;--mu:#6b7280;--bd:#e3e6ec;--ac:#2563eb;--g:#0f9d58;--r:#d93025;--y:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--tx:#e8eaf0;--mu:#8b93a3;--bd:#2a2f3a;--ac:#5b8cff;--g:#34c27a;--r:#ff6b60;--y:#e0b04a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:4px;padding:8px 10px;overflow-x:auto}
header b{margin-right:10px;align-self:center;white-space:nowrap}
.tab{border:0;background:none;color:var(--mu);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}.tab.on{background:var(--ac);color:#fff}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:7px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
textarea{min-height:56px;resize:vertical}
.btn{background:var(--ac);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer}.btn.s{background:var(--bd);color:var(--tx)}.btn.d{background:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{border:1px solid var(--bd);border-radius:99px;padding:3px 10px;cursor:pointer;background:var(--bg);font-size:12px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.kpi{padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}.kpi small{color:var(--mu);display:block;font-size:11px}.kpi b{font-size:18px}
.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:500;cursor:pointer}
.sc{overflow-x:auto}.bar{height:8px;border-radius:4px;min-width:2px}
.cal{display:flex;flex-wrap:wrap;gap:3px}.cd{width:26px;height:26px;border-radius:5px;font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff}
canvas{width:100%;height:220px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:120px}
.hide{display:none}.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--bd)}
.pz{min-height:90px;border:2px dashed var(--bd);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;outline:none;align-content:flex-start}.pz:focus,.pz.on{border-color:var(--ac)}.pz img{height:80px;border-radius:6px;cursor:zoom-in}.th{position:relative}.th b{position:absolute;top:2px;right:2px;background:var(--r);color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;cursor:pointer;font-size:12px}.ph{color:var(--mu);font-size:12px;width:100%}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;overflow:auto;padding:14px}.ov .in{max-width:1000px;margin:0 auto;background:var(--card);border-radius:12px;padding:14px}.ov img{width:100%;border-radius:8px;margin:6px 0}
.sec{font-weight:600;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--bd);color:var(--ac);font-size:13px;letter-spacing:.3px}.sec:first-of-type{border:0;margin-top:6px;padding-top:0}
.fld{margin-bottom:10px}input,select{font-size:15px}.chip{padding:6px 12px;font-size:13px}.chip.add{color:var(--mu);border-style:dashed}.seg.rm .chip:not(.add){border-color:var(--r)}
.ta{min-height:120px;font-size:15px;line-height:1.55;overflow:hidden;resize:none}.ex{color:var(--ac);cursor:pointer;float:right;font-size:12px}
.sbar{position:sticky;bottom:0;background:var(--card);padding:10px 12px;border-top:1px solid var(--bd);margin:14px -12px -12px;display:flex;gap:8px;border-radius:0 0 12px 12px;z-index:3}
.ck{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--tx);cursor:pointer;margin:10px 0}.ck input{width:22px;height:22px}
.y{color:var(--y)}.kpi b{font-size:20px}.kpi i{font-style:normal;font-size:11px;color:var(--mu);display:block;margin-top:2px}
.pl{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.pl .chip{white-space:nowrap;font-size:14px;padding:8px 14px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin:2px}.dot.g{background:var(--g)}.dot.r{background:var(--r)}.dot.m{background:var(--mu)}
.sb{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bd);margin:8px 0 4px}.sb span{display:block;height:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}.tiles .card{margin:0}
.br{display:grid;grid-template-columns:minmax(70px,100px) 1fr 62px 70px;gap:6px;align-items:center;margin:6px 0;font-size:12.5px}.bk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bt{background:var(--bg);border-radius:4px;height:10px}.bb{height:10px;border-radius:4px}.bb.p{background:var(--g)}.bb.l{background:var(--r)}.bv{text-align:right;font-weight:600}.bn{color:var(--mu);font-size:11px;text-align:right}
.ins{border-left:4px solid var(--bd);padding:8px 12px;margin:10px 0;background:var(--bg);border-radius:8px}.ins.bad{border-color:var(--r)}.ins.good{border-color:var(--g)}.ins.tip{border-color:var(--y)}.it{font-weight:600}.ib{margin-top:2px;line-height:1.5}
</style></head><body>
<header><b>📈 Trading Journal</b><button class="tab on" data-t="add">➕ Trade</button><button class="tab" data-t="list">📋 Trades</button><button class="tab" data-t="ana">📊 Analysis</button><button class="tab" data-t="data">⚙️ Data &amp; Backup</button></header>
<main>
<section id="add"></section>
<section id="list" class="hide"></section>
<section id="ana" class="hide"></section>
<section id="data" class="hide"></section>
</main>
<script>
const SEED=[];
const KEY='tj_v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=['id','date','time','account','pair','session','dir','tf','htf','strat','rr','did','pnl','risk','r','quick','bestalt','whatif','maxr','mistake','mnote','rule','style','logic','note'];
const ARR=['htf','strat','mistake'],NUM=['rr','pnl','risk','r','whatif','maxr'],TFS=['5M','15M','1H','4H','1D'],BIAS=['Bullish','Bearish','Sideways'];
const DEF={style:['Scalp','Intraday','Swing'],account:['Funded','Real','Personal'],pair:['XAUUSD','BTC','US30','USTEC','XAGUSD'],session:['Asian','London','New York'],dir:['Buy','Sell'],tf:['1m','3m','5m','15m','1h'],did:['TP hit','SL hit','Trailed SL','C to C','Self book','Hold for more profit'],quick:['Immediate Profit','Immediate Loss'],bestalt:['As planned','Hold original SL/TP','Remove TP + aggressive trail','Book C to C','Trail SL after recovery','Hold for bigger profit','Book as per TP'],htf:['5m','15m','1h','4h','1d'],strat:['EMA','Market structure','Resistance zone','Support zone','Trendline','Price action','Breakout'],mistake:['No mistake','Against levels','Ignored price action','Revenge trade','Overtrade','Early exit','No setup']};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.trades)S={trades:SEED,url:'',t:0,last:{}};
S.lists=S.lists||{};let edit=null,tmr;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(tmr);if(S.url)tmr=setTimeout(()=>push(true),1500)}
function opts(k){if(S.lists[k])return S.lists[k];const s=new Set(DEF[k]||[]);S.trades.forEach(t=>(ARR.includes(k)?t[k]||[]:[t[k]]).forEach(v=>v&&s.add(v)));return[...s]}
const fm=v=>v==null||v===''?'–':(v<0?'-':'')+'$'+Math.abs(v).toFixed(2).replace(/\.00$/,''),cl=v=>v>0?'g':v<0?'r':'';
const out=t=>t.pnl>0?'Profit':t.pnl<0?'Loss':'Breakeven';
// ---------- tabs
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.t));
function show(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t==t));['add','list','ana','data'].forEach(s=>$('#'+s).classList.toggle('hide',s!=t));({add:rAdd,list:rList,ana:rAna,data:rData})[t]()}
// ---------- add / edit
let ch={},sv={},rm={},ruleDirty=false;const MULTI=['strat','mistake'],SINGLE=['account','pair','session','dir','tf','did','quick','bestalt','style'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const isOn=(k,o)=>MULTI.includes(k)?(ch[k]||[]).includes(o):sv[k]==o;
function segIn(k){const L=[...new Set([...opts(k),...(MULTI.includes(k)?ch[k]||[]:[sv[k]])].filter(Boolean))];return L.map(o=>`<span class="chip ${isOn(k,o)?'on':''}" data-v="${esc(o)}">${esc(o)}${rm[k]?' ✕':''}</span>`).join('')+`<span class="chip add" data-a="1">＋ add</span><span class="chip add" data-m="1">${rm[k]?'✔ done':'✎ edit list'}</span>`}
const seg=k=>`<div class="chips seg ${rm[k]?'rm':''}" data-s="${k}">${segIn(k)}</div>`;
function segBind(){document.querySelectorAll('#add .seg').forEach(g=>g.onclick=e=>{const k=g.dataset.s,c=e.target.closest('.chip'),M=MULTI.includes(k);if(!c)return;
if(c.dataset.a){const n=(prompt('New option')||'').trim();if(n){S.lists[k]=[...opts(k),n];save();if(M)ch[k]=[...(ch[k]||[]),n];else sv[k]=n}}
else if(c.dataset.m)rm[k]=!rm[k];
else{const o=c.dataset.v;if(rm[k]){S.lists[k]=opts(k).filter(x=>x!=o);save();if(M)ch[k]=(ch[k]||[]).filter(x=>x!=o);else if(sv[k]==o)sv[k]=''}
else if(M)ch[k]=isOn(k,o)?ch[k].filter(x=>x!=o):[...(ch[k]||[]),o];else sv[k]=sv[k]==o?'':o}
g.classList.toggle('rm',!!rm[k]);g.innerHTML=segIn(k)})}
const grow=e=>{e.style.height='auto';e.style.height=Math.max(120,e.scrollHeight+4)+'px'};
const ta=(k,l)=>`<div class="fld"><label>${l} <a class="ex" data-ex="${k}">⤢ expand</a></label><textarea id="f_${k}" class="ta" rows="4"></textarea></div>`;
const nf=(k,l)=>`<div><label>${l}</label><input id="f_${k}" type="number" step="any" inputmode="decimal"></div>`;
function rAdd(){const t=edit?S.trades.find(x=>x.id==edit):null,L=S.last||{},v=t||{date:iso(new Date()),account:L.account,pair:L.pair,tf:L.tf,session:'New York',style:'Scalp',strat:L.strat,htf:[],mistake:[]};
sv={};SINGLE.forEach(k=>sv[k]=v[k]||'');ch={htf:[...(v.htf||[])],strat:[...(v.strat||[])],mistake:[...(v.mistake||[])]};rm={};ruleDirty=false;
$('#add').innerHTML=`<div class="card"><h3>${t?'✏️ Edit trade #'+t.id+(queue?' · '+S.trades.filter(x=>MISS(x).length&&!skipped.has(x.id)).length+' incomplete baaki':''):'➕ New trade'}</h3>${queue&&t?'<p class="m" style="margin:0">Bharna baaki: <b>'+(MISS(t).join(', ')||'sab bhara hai')+'</b></p>':''}
<div class="sec">1 · Trade setup</div>
<div class="grid"><div><label>Date</label><input id="f_date" type="date"></div><div><label>Entry time</label><input id="f_time" placeholder="e.g. 7:45 pm"></div></div>
<div class="fld" style="margin-top:10px"><label>Account</label>${seg('account')}</div><div class="fld"><label>Pair</label>${seg('pair')}</div><div class="fld"><label>Session</label>${seg('session')}</div><div class="fld"><label>Direction</label>${seg('dir')}</div><div class="fld"><label>Entry timeframe</label>${seg('tf')}</div>
<div class="sec">2 · Market context</div>
<label>HTF trend at entry</label><div class="grid">${TFS.map(x=>`<div><label>${x}</label><select data-tf="${x}"><option value="">–</option>${BIAS.map(b=>`<option>${b}</option>`).join('')}</select></div>`).join('')}</div>
<div class="fld" style="margin-top:10px"><label>Strategy</label>${seg('strat')}</div><div class="grid">${nf('rr','Planned RR (1:x → type x)')}</div>${ta('logic','Logic / market view')}
<div class="sec">3 · Result</div>
<div class="fld"><label>What I did</label>${seg('did')}</div>
<div class="fld"><label>Actual P&amp;L ($): type amount, then tap Profit or Loss</label><div class="row"><input id="f_pnl" type="number" step="any" inputmode="decimal" placeholder="amount"><button type="button" class="btn s" id="pp">＋ Profit</button><button type="button" class="btn s" id="pl">－ Loss</button></div></div>
<div class="grid">${nf('risk','Risk / SL size ($)')}${nf('r','Actual R (auto if risk filled)')}</div>
<div class="fld" style="margin-top:10px"><label>Quick view</label>${seg('quick')}</div>
<div class="sec">4 · Review</div>
<div class="fld"><label>Best alternative</label>${seg('bestalt')}</div><div class="grid">${nf('whatif','What-if result ($)')}${nf('maxr','Max R price reached')}</div>
<div class="fld" style="margin-top:10px"><label>Mistake</label>${seg('mistake')}</div>${ta('mnote','Mistake note / learning')}
<label class="ck"><input type="checkbox" id="f_rule"> Rule followed ✔</label>${ta('note','Note')}
<div class="grid">${['entry','result'].map(k=>`<div><label>${k=='entry'?'Entry screenshots (1m + HTF)':'Exit / result screenshots'}: click box, then Ctrl+V</label><div class="pz" tabindex="0" data-z="${k}"></div></div>`).join('')}</div>
<div class="sec">5 · Trading style</div><div class="fld">${seg('style')}</div>
<div class="sbar"><button class="btn" id="sv">${t?'Update trade':'Save trade'}</button>${t?'<button class="btn s" id="cn">Cancel</button>':''}${queue?'<button class="btn s" id="sk">Skip →</button>':''}</div></div>`;
['date','time','rr','pnl','risk','r','whatif','maxr','logic','mnote','note'].forEach(k=>{$('#f_'+k).value=v[k]??''});
$('#f_rule').checked=v.rule=='Yes';$('#f_rule').onchange=()=>ruleDirty=true;
document.querySelectorAll('.ta').forEach(a=>{grow(a);a.oninput=()=>grow(a)});
document.querySelectorAll('[data-tf]').forEach(s=>{const m=(v.htf||[]).find(x=>x.startsWith(s.dataset.tf+' '));s.value=m?m.split(' ')[1]:''});
segBind();
document.querySelectorAll('.ex').forEach(a=>a.onclick=()=>{const f=$('#f_'+a.dataset.ex);modal(`<h3>${esc(a.parentNode.textContent.replace('⤢ expand','').trim())}</h3><textarea id="mx" style="height:60vh;font-size:16px;line-height:1.6"></textarea><p class="m">Whatever you type is saved into the form instantly. Close when done.</p>`);const m=$('#mx');m.value=f.value;m.focus();m.oninput=()=>{f.value=m.value;grow(f)}});
$('#pp').onclick=()=>{const e=$('#f_pnl');if(e.value!=='')e.value=Math.abs(+e.value)};$('#pl').onclick=()=>{const e=$('#f_pnl');if(e.value!=='')e.value=-Math.abs(+e.value)};
shots={entry:[],result:[]};zone='entry';drawZ();if(t)sget(t.id).then(x=>{shots=x;drawZ()});
document.querySelectorAll('.pz').forEach(z=>{z.onfocus=z.onclick=()=>{zone=z.dataset.z;document.querySelectorAll('.pz').forEach(y=>y.classList.toggle('on',y==z))};z.ondragover=e=>e.preventDefault();z.ondrop=async e=>{e.preventDefault();zone=z.dataset.z;for(const f of e.dataTransfer.files)if(f.type.startsWith('image/'))shots[zone].push(await comp(f));drawZ()}});
$('#sv').onclick=()=>{const g=k=>$('#f_'+k).value,n=k=>g(k)===''?null:+g(k);
const o={id:t?t.id:Math.max(0,...S.trades.map(x=>x.id))+1,date:g('date'),time:g('time').trim(),...sv,strat:ch.strat,mistake:ch.mistake,rr:n('rr'),pnl:n('pnl'),risk:n('risk'),r:n('r'),whatif:n('whatif'),maxr:n('maxr'),logic:g('logic').trim(),mnote:g('mnote').trim(),note:g('note').trim(),rule:(ruleDirty||!t||t.rule)?($('#f_rule').checked?'Yes':'No'):''};
o.htf=[...(ch.htf||[]).filter(x=>!/ (Bullish|Bearish|Sideways)$/.test(x)),...[...document.querySelectorAll('[data-tf]')].filter(s=>s.value).map(s=>s.dataset.tf+' '+s.value)];
if(!o.date||o.date<'2000-01-01'||o.pnl==null){alert('Please check: Date (4-digit year) and P&L are required');return}
if(o.risk>0&&o.r==null)o.r=Math.round(o.pnl/o.risk*100)/100;
if(t)Object.assign(t,o);else S.trades.push(o);S.last={account:o.account,pair:o.pair,tf:o.tf,strat:o.strat};sput(o.id,shots);save();if(queue){skipped.add(o.id);const n=nextInc();if(n){edit=n.id;rAdd();scrollTo(0,0);return}queue=false;alert('Sab trades complete ✔')}edit=null;show('list')};
if($('#cn'))$('#cn').onclick=()=>{edit=null;queue=false;rAdd()};if($('#sk'))$('#sk').onclick=()=>{skipped.add(t.id);const n=nextInc();if(n){edit=n.id;rAdd();scrollTo(0,0)}else{queue=false;edit=null;show('list')}}}
// ---------- list + shared filter bar
let sortK='date',sortD=-1,q='';
const filt=t=>(!flt.account||t.account==flt.account)&&(!flt.pair||t.pair==flt.pair)&&(!flt.from||t.date>=flt.from)&&(!flt.to||t.date<=flt.to);
function fbar(id,cb){const el=$('#'+id),sel=(k,l)=>`<div><label>${l}</label><select data-f="${k}"><option value="">All</option>${opts(k).map(o=>`<option ${flt[k]==o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
el.innerHTML=`<div class="card"><div class="chips" style="margin-bottom:8px">${[['all','All time'],['month','This month'],['30d','Last 30 days'],['year','This year'],['new','📌 New account']].map(([k,l])=>`<span class="chip" data-q="${k}">${l}</span>`).join('')}</div>
<div class="row">${sel('account','Account')}${sel('pair','Pair')}<div><label>From date</label><input type="date" class="df" value="${flt.from}"></div><div><label>To date</label><input type="date" class="dt" value="${flt.to}"></div><div style="flex:0 0 auto"><button class="btn ap">Apply ▶</button></div></div>
<p class="m" style="margin:8px 0 0;font-size:12px">${S.acctStart?'📌 New account start: <b>'+S.acctStart+'</b> · ':''}<a href="#" class="sp" style="color:var(--ac)">use the “From” date as my new-account start</a></p></div>`;
const read=()=>{const a=el.querySelector('.df').value,b=el.querySelector('.dt').value;if((a&&(a<'2000-01-01'||a>'2100-01-01'))||(b&&(b<'2000-01-01'||b>'2100-01-01'))){alert('Please enter a full 4-digit year (like 2026)');return false}if(a&&b&&a>b){alert('From date is after To date');return false}flt.from=a;flt.to=b;return true};
el.querySelectorAll('select[data-f]').forEach(s=>s.onchange=()=>{flt[s.dataset.f]=s.value;cb()});
el.querySelector('.ap').onclick=()=>{if(read())cb()};
el.querySelector('.sp').onclick=e=>{e.preventDefault();if(!read())return;if(!flt.from){alert('Pehle From date daalo');return}S.acctStart=flt.from;save();fbar(id,cb)};
el.querySelectorAll('[data-q]').forEach(c=>c.onclick=()=>{const k=c.dataset.q,d=new Date();
if(k=='all'){flt.from='';flt.to=''}else if(k=='month'){flt.from=iso(new Date(d.getFullYear(),d.getMonth(),1));flt.to=''}else if(k=='30d'){flt.from=iso(new Date(d.getTime()-30*864e5));flt.to=''}else if(k=='year'){flt.from=d.getFullYear()+'-01-01';flt.to=''}else{if(!S.acctStart){alert('Pehle From date daalo aur niche wala “use the From date as my new-account start” dabao');return}flt.from=S.acctStart;flt.to=''}
fbar(id,cb);cb()})}
function rList(){$('#list').innerHTML='<div id="fl"></div><div class="card"><div class="row"><input id="q" placeholder="🔍 Search (pair, strategy, note...)"><span id="sm" class="m"></span><button class="btn s" id="fx" style="flex:0 0 auto"></button></div></div><div class="card sc" id="lt"></div>';fbar('fl',listBody);const i=$('#q');$('#fx').textContent='▶ Fix incomplete ('+S.trades.filter(t=>MISS(t).length).length+')';$('#fx').onclick=startQueue;i.value=q;i.oninput=e=>{q=e.target.value.toLowerCase();listBody()};listBody()}
function listBody(){const rows=S.trades.filter(filt).filter(t=>!q||JSON.stringify(t).toLowerCase().includes(q)).sort((a,b)=>(a[sortK]>b[sortK]?1:-1)*sortD||b.id-a.id),s=stats(rows);

return `<div class="card"><h3>Kaunsi galti kitna paisa khaa rahi hai</h3>${ms.length?bars(ms):'<p class="m">Mistake tags abhi nahi bhare. Neeche "Fix incomplete trades" se bhar.</p>'}<p class="m" style="font-size:12px;margin-bottom:0">Bar = us galti wale trades ka kul P&L. Ek trade me kai galtiyan ho sakti hain.</p></div>
<div class="card"><h3>Rule followed vs broken</h3><div class="grid">${K2('Rule follow ✔',y?fm(y.pnl):'–',y?cl(y.pnl):'',y?`${y.n} trades · avg ${fm(y.avg)} · win ${y.wr.toFixed(0)}%`:'data nahi')}${K2('Rule toda ✘',n?fm(n.pnl):'–',n?cl(n.pnl):'',n?`${n.n} trades · avg ${fm(n.avg)} · win ${n.wr.toFixed(0)}%`:'data nahi')}</div></div>
<div class="card"><h3>Loss ke baad agla trade kaisa</h3><div class="sc">${tbl(al)}</div></div><div class="card"><h3>Ek din me kitne trade</h3><div class="sc">${tbl(nb)}</div></div>
<div class="card"><h3>🧩 Data kitna complete hai</h3><p>${inc?`${inc} trades me kuch bharna baaki hai (Direction ${cnt.Direction} · Session ${cnt.Session} · Mistake ${cnt.Mistake} · Quick view ${cnt['Quick view']} · Rule ${cnt.Rule}).`:'Sab trades complete hain ✔'}</p>${inc?'<button class="btn" id="fx">▶ Fix incomplete trades (ek ek karke)</button>':''}</div>`}
// ---- Exits
function vExit(a,s){const d=GN(a,'did'),wi=a.filter(t=>t.whatif!=null),wis=wi.reduce((x,t)=>x+t.whatif,0),wia=wi.reduce((x,t)=>x+t.pnl,0),ba={};wi.forEach(t=>{const k=t.bestalt||'(blank)';(ba[k]=ba[k]||{n:0,x:0}).n++;ba[k].x+=t.whatif-t.pnl});
const O=['<1R','1-2R','2-3R','3R+'],mr=GN(a,'maxr').sort((x,y)=>O.indexOf(x.k)-O.indexOf(y.k));
return `<div class="card"><h3>Main trade kaise band karta hu</h3>${d.length?bars(d):'<p class="m">What I did abhi nahi bhara</p>'}<div class="sc">${tbl(d)}</div></div>
<div class="card"><h3>Jo kiya vs What-if</h3>${wi.length?`<p>${wi.length} trades: actual <b class="${cl(wia)}">${fm(wia)}</b> · what-if <b class="${cl(wis)}">${fm(wis)}</b> · fark <b class="${cl(wis-wia)}">${fm(wis-wia)}</b></p><table><tr><th>Best alternative</th><th>Trades</th><th>Extra $ agar follow karta</th></tr>${Object.entries(ba).sort((x,y)=>y[1].x-x[1].x).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td class="${cl(v.x)}">${fm(v.x)}</td></tr>`).join('')}</table>`:'<p class="m">What-if result bharoge to yahan dikhega ki trail/early exit ne kitna bachaya ya gawaya.</p>'}</div>
<div class="card"><h3>Price kitna gaya (Max R)</h3>${mr.length?bars(mr):'<p class="m">Max R bharoge to yahan dikhega.</p>'}</div><div class="card"><h3>Quick view</h3><div class="sc">${tbl(GN(a,'quick'))}</div></div>`}
// ---- Deep dive
function vDeep(a){return `<div class="card"><div class="row"><h3 style="flex:2">Kisi bhi cheez se breakdown</h3><select id="dim">${Object.entries(DIMS).map(([k,v])=>`<option value="${k}" ${dim==k?'selected':''}>${v[0]}</option>`).join('')}</select></div>${tbl(G(a,dim))}</div>`}
// ---------- data / backup
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return F.join(',')+'\n'+S.trades.map(t=>F.map(k=>q(ARR.includes(k)?(t[k]||[]).join('|'):t[k])).join(',')).join('\n')}
function parseCsv(s){const r=[];let row=[],f='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c=='"'){if(s[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&s[i+1]=='\n')i++;row.push(f);f='';if(row.length>1||row[0])r.push(row);row=[]}else f+=c}if(f||row.length){row.push(f);r.push(row)}return r}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
async function push(q){const el=$('#st');try{await fetch(S.url,{method:'POST',mode:'no-cors',body:JSON.stringify({trades:S.trades,fields:F})});S.t=Date.now();localStorage.setItem(KEY,JSON.stringify(S));if(el)el.textContent='✔ Sheet backup sent '+new Date().toLocaleTimeString()}catch(e){if(el)el.textContent='✘ Backup failed (offline?). Data is safe in this browser.'}}
function rData(){$('#data').innerHTML=`<div class="card"><h3>Backup to Google Sheet (automatic)</h3><p class="m">Paste your Apps Script Web App URL once. After that every save is sent to your Sheet automatically.</p><div class="row"><input id="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(S.url)}"><button class="btn" id="su">Save URL</button><button class="btn s" id="pn">Backup now</button><button class="btn s" id="rs">Restore from Sheet</button></div><p id="st" class="m">${S.t?'Last backup: '+new Date(S.t).toLocaleString():'Not backed up yet'}</p></div>
<div class="card"><h3>Excel / CSV</h3><div class="row"><button class="btn" id="ex">Export CSV (opens in Excel)</button><button class="btn s" id="ej">Export everything (with screenshots)</button><div><label>Import CSV / JSON (replaces all data)</label><input type="file" id="im" accept=".csv,.json"></div></div><p class="m">Total trades stored: ${S.trades.length}. Export now and then as an extra safety copy.</p></div>
${rLists()}<div class="card"><h3>Danger zone</h3><button class="btn d" id="wp">Delete all trades</button></div>`;
$('#su').onclick=()=>{S.url=$('#url').value.trim();save();alert('Saved')};$('#pn').onclick=()=>{if(!S.url)return alert('Add the URL first');push()};
$('#rs').onclick=async()=>{if(!S.url||!confirm('Replace local data with the Sheet data?'))return;try{const j=await(await fetch(S.url)).json();if(j.trades){S.trades=j.trades;save();alert('Restored '+j.trades.length+' trades');rData()}}catch(e){alert('Could not read the Sheet')}};
$('#ex').onclick=()=>dl('trading-journal.csv','\ufeff'+csv(),'text/csv');$('#ej').onclick=async()=>{const sh={};for(const x of S.trades){const v=await sget(x.id);if(v.entry.length||v.result.length)sh[x.id]=v}dl('trading-journal-full.json',JSON.stringify({trades:S.trades,shots:sh}),'application/json')};lHand();
$('#wp').onclick=()=>{if(confirm('Delete ALL trades? Export first!')){S.trades=[];save();rData()}};
$('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{let t,sh={};if(f.name.endsWith('.json')){t=JSON.parse(rd.result);if(!Array.isArray(t)){sh=t.shots||{};t=t.trades}}else{const r=parseCsv(rd.result.replace(/^\ufeff/,'')),h=r[0];t=r.slice(1).map(c=>{const o={};h.forEach((k,i)=>{const v=c[i];o[k]=ARR.includes(k)?(v?v.split('|'):[]):NUM.includes(k)||k=='id'?(v===''||v==null?null:+v):v});return o})}
if(!confirm('Replace current '+S.trades.length+' trades with '+t.length+' imported trades?'))return;S.trades=t.map((o,i)=>({...o,id:o.id||i+1}));Object.entries(sh).forEach(([i,v])=>sput(+i,v));save();alert('Imported '+t.length);rData()}catch(x){alert('Import failed: '+x.message)}};rd.readAsText(f)}}
// ---------- screenshots
let shots={entry:[],result:[]},zone='entry',dbp;
const idb=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('tj_shots',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}));
const E0=()=>({entry:[],result:[]});
const sget=async id=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction('s').objectStore('s').get(id);q.onsuccess=()=>r(q.result||E0());q.onerror=()=>r(E0())})}catch(e){return E0()}};
const sput=async(id,v)=>{try{const d=await idb();d.transaction('s','readwrite').objectStore('s').put(v,id)}catch(e){}};
const comp=f=>new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1100/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};i.src=URL.createObjectURL(f)});
function drawZ(){document.querySelectorAll('.pz').forEach(z=>{const k=z.dataset.z;z.innerHTML=shots[k].length?shots[k].map((s,i)=>`<span class="th"><img src="${s}" data-i="${i}"><b data-d="${i}">×</b></span>`).join(''):'<div class="ph">Paste (Ctrl+V) or drop screenshots here</div>';
z.querySelectorAll('img').forEach(m=>m.onclick=e=>{e.stopPropagation();modal(`<img src="${m.src}">`)});z.querySelectorAll('b').forEach(b=>b.onclick=e=>{e.stopPropagation();shots[k].splice(+b.dataset.d,1);drawZ()})})}
document.addEventListener('paste',async e=>{if($('#add').classList.contains('hide'))return;const fs=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile());if(!fs.length)return;e.preventDefault();for(const f of fs)shots[zone].push(await comp(f));drawZ()});
function modal(h){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="in"><button class="btn s" style="float:right">Close ✕</button>${h}</div>`;o.onclick=e=>{if(e.target==o||e.target.tagName=='BUTTON')o.remove()};document.body.appendChild(o)}
async function openView(id){const t=S.trades.find(x=>x.id==id),s=await sget(id),L=(a,v)=>v?`<p style="white-space:pre-wrap;line-height:1.55"><b>${a}:</b> ${esc(v)}</p>`:'';
modal(`<h3>${t.date} · ${esc(t.pair)} · ${esc(t.account)} · <span class="${cl(t.pnl)}">${fm(t.pnl)}</span></h3>${L('Did',t.did)}${L('Strategy',(t.strat||[]).join(', '))}${L('HTF',(t.htf||[]).join(', '))}${L('Logic',t.logic)}${L('Mistake',t.mnote)}${L('Note',t.note)}${s.entry.length?'<h3>Entry</h3>'+s.entry.map(x=>`<img src="${x}">`).join(''):''}${s.result.length?'<h3>Result</h3>'+s.result.map(x=>`<img src="${x}">`).join(''):''}`)}
// ---------- editable dropdown lists
const LK=[['account','Account'],['pair','Pair'],['session','Session'],['dir','Direction'],['tf','Entry TF'],['did','What I did'],['quick','Quick view'],['bestalt','Best alternative'],['strat','Strategy'],['mistake','Mistake'],['style','Trading style']];let lk='pair';
function rLists(){return `<div class="card"><h3>Edit dropdown lists</h3><select id="lk">${LK.map(([k,l])=>`<option value="${k}" ${lk==k?'selected':''}>${l}</option>`).join('')}</select><div class="chips" style="margin:8px 0">${opts(lk).map(o=>`<span class="chip" data-r="${esc(o)}">${esc(o)} ✕</span>`).join('')}</div><div class="row"><input id="ln" placeholder="New option"><button class="btn" id="la">Add</button></div><p class="m">Removing hides it from the dropdown only; old trades keep their value.</p></div>`}
function lHand(){$('#lk').onchange=e=>{lk=e.target.value;rData()};document.querySelectorAll('[data-r]').forEach(c=>c.onclick=()=>{S.lists[lk]=opts(lk).filter(x=>x!=c.dataset.r);save();rData()});$('#la').onclick=()=>{const n=$('#ln').value.trim();if(n&&!opts(lk).includes(n)){S.lists[lk]=[...opts(lk),n];save();rData()}}}
rAdd();
</script></body></html>
