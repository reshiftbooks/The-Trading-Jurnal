<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Trading Journal Pro</title>
<style>
:root{--bg:#f4f6fb;--bg2:#eef1f8;--card:#ffffff;--ink:#0b1220;--mu:#64748b;--bd:#e5e9f2;--ac:#4f46e5;--btn:#4f46e5;--soft:#eef0ff;--g:#059669;--gb:#dcf5ea;--r:#e11d48;--rb:#ffe6ec;--y:#b45309;--yb:#fdf2d7;--hov:rgba(79,70,229,.045);--ring:rgba(79,70,229,.22);--sh:0 1px 2px rgba(11,18,32,.05),0 8px 24px rgba(11,18,32,.07);--sh2:0 2px 6px rgba(11,18,32,.06),0 16px 40px rgba(11,18,32,.10);--sb:rgba(255,255,255,.85)}
html[data-theme="dark"]{--bg:#0a0e1a;--bg2:#0d1424;--card:#10182a;--ink:#e9edf7;--mu:#8e9ab8;--bd:#1f2a44;--ac:#8b9bff;--btn:#5663f5;--soft:rgba(139,155,255,.13);--g:#34d399;--gb:rgba(52,211,153,.13);--r:#fb7185;--rb:rgba(251,113,133,.13);--y:#fbbf24;--yb:rgba(251,191,36,.13);--hov:rgba(139,155,255,.06);--ring:rgba(139,155,255,.25);--sh:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px rgba(0,0,0,.35);--sh2:0 1px 0 rgba(255,255,255,.04) inset,0 18px 48px rgba(0,0,0,.5);--sb:rgba(13,19,36,.85)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
::selection{background:var(--soft)}
/* ---------- layout ---------- */
.app{min-height:100vh}
.sb{position:fixed;top:0;bottom:0;left:0;width:242px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:18px 14px 16px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#5663f5,#9d6ef2);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 4px 12px rgba(86,99,245,.35)}
.logo svg{width:20px;height:20px}
.brand b{font-size:15px;letter-spacing:-.2px;line-height:1.2}
.brand small{display:block;color:var(--mu);font-weight:500;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase}
.nnav{display:flex;flex-direction:column;gap:4px}
.ni{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--mu);font:inherit;font-weight:550;cursor:pointer;min-height:44px;text-align:left;transition:background .15s,color .15s;width:100%}
.ni:hover{background:var(--soft);color:var(--ac)}
.ni.on{background:var(--soft);color:var(--ac);font-weight:700}
.ni .ic{width:18px;height:18px;flex:none}
.sbt{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--bd)}
.tbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-weight:550;cursor:pointer;min-height:42px;transition:.15s}
.tbtn:hover{border-color:var(--ac);color:var(--ac)}
.tbtn .ic{width:17px;height:17px;flex:none}
.tlabel{font-size:12.5px}
.cnt{color:var(--mu);font-size:12px;padding:0 6px}
.mcol{flex:1;margin-left:242px;min-width:0}
.topbar{display:none}
.btab{display:none}
.mc{max-width:1180px;margin:0 auto;padding:26px 26px 60px}
.pagehead{margin:2px 0 16px}
.pagehead h2{margin:0;font-size:20px;letter-spacing:-.3px;font-weight:750}
.pagehead p{margin:4px 0 0;color:var(--mu);font-size:13px}
/* ---------- cards & type ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
h3{margin:0 0 12px;font-size:16px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
h3 .ic{width:18px;height:18px;color:var(--ac);flex:none}
h4.sh{margin:22px 2px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--mu);font-weight:650}
.sec{font-weight:700;margin:22px 0 12px;padding-top:16px;border-top:1px solid var(--bd);color:var(--ac);font-size:12px;letter-spacing:.9px;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.sec:first-of-type{border:0;margin-top:6px;padding-top:0}
.sec .ic{width:15px;height:15px}
.m{color:var(--mu)}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.small{font-size:12px}
.hide{display:none!important}
.fade{animation:fin .18s ease}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* ---------- forms ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:130px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px;font-weight:600}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:11px;background:var(--bg2);font-size:15px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ring)}
input[readonly]{opacity:.75}
textarea{min-height:64px;resize:vertical}
textarea.ta{min-height:120px;font-size:15px;line-height:1.55;overflow:hidden;resize:none}
.fld{margin-bottom:14px}
.ex{color:var(--ac);cursor:pointer;float:right;font-size:12px;font-weight:600}
.ck{display:flex;gap:11px;align-items:center;font-size:15px;font-weight:550;color:var(--ink);cursor:pointer;margin:12px 0}
.ck input{width:22px;height:22px;accent-color:var(--btn)}
/* ---------- buttons ---------- */
.btn{background:var(--btn);color:#fff;border:0;padding:10px 18px;border-radius:11px;cursor:pointer;font-weight:650;min-height:40px;transition:filter .15s,transform .1s,box-shadow .15s;box-shadow:0 3px 10px rgba(86,99,245,.25)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px);filter:brightness(.95)}
.btn.s{background:var(--soft);color:var(--ac);box-shadow:none}
.btn.s:hover{filter:none;background:var(--soft);border-color:transparent;box-shadow:inset 0 0 0 1px var(--ac)}
.btn.d{background:var(--r);color:#fff;box-shadow:0 3px 10px rgba(225,29,72,.25)}
.btn.xs{padding:5px 10px;min-height:32px;font-size:12.5px;border-radius:9px;box-shadow:none}
/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);border-radius:99px;padding:8px 14px;cursor:pointer;background:var(--card);font-size:13px;font-weight:550;min-height:38px;transition:border-color .15s,background .15s,color .15s;user-select:none}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.chip.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.chip.on .ick{width:12px;height:12px;flex:none}
.chip.add{color:var(--mu);border-style:dashed;background:transparent}
.chip.on2{background:var(--soft);color:var(--ac);border-color:transparent;cursor:default;font-weight:700}
.chip.on2:hover{color:var(--ac)}
.ick{width:12px;height:12px}
.ix{width:11px;height:11px;opacity:.7}
.seg.rm .chip:not(.add){border-color:var(--r)}
/* ---------- KPI / tiles ---------- */
.kpi{padding:14px 16px;border:1px solid var(--bd);border-radius:15px;background:var(--card);box-shadow:var(--sh)}
.kpi small{color:var(--mu);display:block;font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.4px}
.kpi b{font-size:22px;letter-spacing:-.4px}
.kpi i{font-style:normal;font-size:11.5px;color:var(--mu);display:block;margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.tiles .card{margin:0}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:8px}
.act{border:1px solid var(--bd);border-radius:16px;padding:15px 16px;cursor:pointer;background:var(--card);box-shadow:var(--sh);transition:transform .15s,box-shadow .15s,border-color .15s}
.act:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--ac)}
.act small{display:block;font-weight:750;font-size:11px;letter-spacing:.5px;margin-bottom:5px}
.act b{display:block;font-size:15px;line-height:1.35}
.act span{display:block;color:var(--mu);font-size:12.5px;margin-top:4px}
.act.bad{border-top:3px solid var(--r)}.act.good{border-top:3px solid var(--g)}.act.tip{border-top:3px solid var(--y)}
.sc2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.t6{border:1px solid var(--bd);border-radius:16px;padding:15px 16px;background:var(--card);box-shadow:var(--sh)}
.t6 small{color:var(--mu);font-weight:650;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.t6 .v{font-size:28px;font-weight:800;margin:3px 0;letter-spacing:-.5px}
.t6 p{margin:5px 0 0;color:var(--mu);font-size:12px}
.stt{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;margin-left:6px}
.stt.g{background:var(--gb);color:var(--g)}.stt.r{background:var(--rb);color:var(--r)}.stt.y{background:var(--yb);color:var(--y)}
.gauge{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--r) 0 33%,var(--y) 33% 50%,var(--g) 50%);margin:14px 0 4px;opacity:.9}
.gauge i{position:absolute;top:-4px;width:4px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
/* ---------- bars ---------- */
.bar{height:8px;border-radius:4px;min-width:2px}
.sb2{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bd);margin:12px 0 6px}.sb2 span{display:block;height:100%}
.br{display:grid;grid-template-columns:minmax(70px,120px) 1fr 68px 78px;gap:9px;align-items:center;margin:8px 0;font-size:12.5px}
.bk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bt{background:var(--bg2);border-radius:5px;height:12px;overflow:hidden}
.bb{height:12px;border-radius:5px}.bb.p{background:var(--g)}.bb.l{background:var(--r)}
.bv{text-align:right;font-weight:700}
.bn{color:var(--mu);font-size:11px;text-align:right}
.dot{display:inline-block;width:15px;height:15px;border-radius:50%;margin:2px;box-shadow:0 1px 3px rgba(0,0,0,.25)}.dot.g{background:var(--g)}.dot.r{background:var(--r)}.dot.m{background:var(--mu)}
/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:650;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;position:sticky;top:0;background:var(--card);z-index:1}
td{cursor:default}
.sc{overflow:auto;border-radius:12px}
.sc.lt{max-height:62vh}
.lt tr:hover td,.sc tr:hover td{background:var(--hov)}
.rb{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px}
.rb.pg{background:var(--gb);color:var(--g)}.rb.ng{background:var(--rb);color:var(--r)}
/* ---------- pills ---------- */
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 16px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd);border-radius:99px;background:var(--card);color:var(--mu);padding:9px 16px;min-height:40px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.pill .ic{width:15px;height:15px}
.pill:hover{border-color:var(--ac);color:var(--ac)}
.pill.on{background:var(--btn);border-color:var(--btn);color:#fff}
/* ---------- hero ---------- */
.hero{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;padding:24px;border-radius:20px;border:1px solid var(--bd);margin-bottom:16px;box-shadow:var(--sh2);align-items:center}
.hero.p{background:linear-gradient(135deg,var(--card) 45%,var(--gb))}
.hero.l{background:linear-gradient(135deg,var(--card) 45%,var(--rb))}
.big{font-size:40px;font-weight:800;letter-spacing:-1.2px;line-height:1.08}
.vd{font-size:15px;margin-top:5px;color:var(--mu)}
.rings{display:flex;gap:18px;align-items:center}
.rings>div{text-align:center}
.ring{position:relative;width:118px;height:118px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rt b{font-size:23px}.rt small{color:var(--mu);font-size:10.5px}
.rings label{margin-top:5px;font-size:11px}
/* ---------- insights ---------- */
.ins{border-left:4px solid var(--bd);padding:12px 16px;margin:10px 0;background:var(--bg2);border-radius:13px}
.ins.bad{border-left-color:var(--r)}.ins.good{border-left-color:var(--g)}.ins.tip{border-left-color:var(--y)}
.it{font-weight:700;display:flex;align-items:center;gap:8px;font-size:14px}
.it .ic{width:17px;height:17px;flex:none}
.ins.bad .it .ic{color:var(--r)}.ins.good .it .ic{color:var(--g)}.ins.tip .it .ic{color:var(--y)}
.ib{margin-top:3px;line-height:1.5}
.ia{margin-top:6px;color:var(--mu);font-size:12.5px;font-weight:550}
.how{margin:0 0 12px;padding:9px 13px;background:var(--soft);border-radius:11px;color:var(--mu);font-size:12.5px;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.how .ic{width:15px;height:15px;flex:none;margin-top:2px;color:var(--ac)}
.how span b{color:var(--ink)}
.focus{border-left:4px solid var(--btn)}
.focus>small{display:block;color:var(--mu);font-weight:750;text-transform:uppercase;letter-spacing:.7px;font-size:11px;margin-bottom:6px}
.focus .fh{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:750;letter-spacing:-.2px}
.focus .fh .ic{width:20px;height:20px;color:var(--btn);flex:none}
/* ---------- edge / alt / cmp ---------- */
.edge{border:1px solid var(--bd);border-radius:15px;padding:15px 16px;margin:11px 0;transition:box-shadow .15s}
.edge:hover{box-shadow:var(--sh)}
.edge.good{border-left:5px solid var(--g)}.edge.bad{border-left:5px solid var(--r)}
.es{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:11px;margin:11px 0 7px}
.es small{display:block;color:var(--mu);font-size:11px;font-weight:600}
.es b{font-size:17px}
.alt{border:1px solid var(--bd);border-radius:15px;padding:15px 16px;margin:11px 0}
.alt h4{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.alt .ex2{font-size:12px;color:var(--mu);margin-top:7px;line-height:1.6}
.cmp{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.cmp>div{flex:1;min-width:180px;border:1px solid var(--bd);border-radius:14px;padding:13px 15px;background:var(--bg2)}
.cmp small{color:var(--mu);font-size:12px}
.cmp b{font-size:26px;display:block;letter-spacing:-.5px}
/* ---------- calendar ---------- */
.calmo{margin-bottom:16px}
.calh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;font-size:13px}
.calh b{font-weight:700}
.calwd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.calwd span{font-size:10.5px;color:var(--mu);text-align:center;font-weight:650}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd2{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:650;background:var(--bg2);color:var(--ink);position:relative}
.cd2.e{background:transparent}
.cd2.pg{color:var(--ink)}.cd2.ng{color:var(--ink)}
/* ---------- equity canvas ---------- */
.eqwrap{position:relative}
canvas{width:100%;height:250px;display:block;cursor:crosshair}
.eqtip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:8px 12px;font-size:12px;box-shadow:var(--sh2);display:flex;flex-direction:column;gap:2px;z-index:5;min-width:150px}
.eqtip b{font-size:12.5px}
/* ---------- R histogram ---------- */
.rh{display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:8px}
.rhb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.rhb .rc{width:100%;max-width:52px;border-radius:6px 6px 3px 3px;min-height:3px}
.rhb small{color:var(--mu);font-size:10.5px;font-weight:600;text-align:center;line-height:1.2}
.rhb b{font-size:12px}
/* ---------- modal / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(6,9,20,.62);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:50;overflow:auto;padding:16px}
.ov .in{max-width:1000px;margin:24px auto;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;box-shadow:var(--sh2)}
.ov img{width:100%;border-radius:11px;margin:8px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:650;font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:60;box-shadow:var(--sh2);max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
html[data-theme="dark"] #toast{background:#e9edf7;color:#0a0e1a}
/* ---------- drop zones ---------- */
.pz{min-height:92px;border:2px dashed var(--bd);border-radius:13px;padding:9px;display:flex;flex-wrap:wrap;gap:7px;outline:none;align-content:flex-start;transition:border-color .15s}
.pz:focus,.pz.on{border-color:var(--ac);background:var(--hov)}
.pz img{height:82px;border-radius:9px;cursor:zoom-in}
.th{position:relative}.th b{position:absolute;top:-5px;right:-5px;background:var(--r);color:#fff;border-radius:50%;width:19px;height:19px;text-align:center;line-height:19px;cursor:pointer;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.ph{color:var(--mu);font-size:12px;width:100%;align-self:center;text-align:center;padding:14px 0}
/* ---------- save bar ---------- */
.sbar{position:sticky;bottom:0;background:var(--card);padding:13px 18px;border-top:1px solid var(--bd);margin:18px -18px -18px;display:flex;gap:9px;border-radius:0 0 18px 18px;z-index:3;backdrop-filter:blur(6px)}
/* ---------- demo banner ---------- */
.demo{position:relative;z-index:40;background:linear-gradient(90deg,#b45309,#d97706);color:#fff;padding:9px 16px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;justify-content:center;border-radius:14px;margin-bottom:16px}
.demo .ic{width:15px;height:15px;flex:none}
.demo button{margin-left:10px;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;padding:5px 11px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;min-height:30px}
/* ---------- misc ---------- */
.ic{width:18px;height:18px;vertical-align:-3px}
.sc::-webkit-scrollbar,.sb::-webkit-scrollbar{height:8px;width:8px}
.sc::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
@media(max-width:1023.5px){
 .sb{display:none}.mcol{margin-left:0}
 .topbar{display:flex;position:sticky;top:0;z-index:30;background:var(--sb);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);align-items:center;justify-content:space-between;padding:9px 14px}
 .topbar b{font-size:15px;letter-spacing:-.2px}
 .topbar .tbtn{min-height:40px;padding:7px 10px}
 .btab{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:35;background:var(--sb);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bd);grid-template-columns:repeat(5,1fr);padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
 .btab .ni{flex-direction:column;gap:3px;align-items:center;font-size:10.5px;min-height:54px;padding:7px 2px}
 .btab .ni.on{background:var(--soft)}
 .mc{padding:14px 13px 100px}
 .card{padding:15px;border-radius:16px}
 .big{font-size:32px}
 .ring{width:98px;height:98px}
 .ov .in{margin:10px auto}
}
@media(min-width:1024px) and (max-width:1240px){.mc{padding:22px 18px 50px}}
</style>
</head>
<body>
<div class="app">
<aside class="sb">

if(c.dataset.a){const n=(prompt('New option')||'').trim();if(n){S.lists[k]=[...opts(k),n];save();if(M)ch[k]=[...(ch[k]||[]),n];else sv[k]=n}}
else if(c.dataset.m)rm[k]=!rm[k];
else{const o=c.dataset.v;if(rm[k]){S.lists[k]=opts(k).filter(x=>x!=o);save();if(M)ch[k]=(ch[k]||[]).filter(x=>x!=o);else if(sv[k]==o)sv[k]=''}
else if(M)ch[k]=isOn(k,o)?ch[k].filter(x=>x!=o):[...(ch[k]||[]),o];else sv[k]=sv[k]==o?'':o}
g.classList.toggle('rm',!!rm[k]);g.innerHTML=segIn(k)})}

sv={};SINGLE.forEach(k=>sv[k]=v[k]||'');ch={htf:[...(v.htf||[])],strat:[...(v.strat||[])],mistake:[...(v.mistake||[])]};rm={};ruleDirty=false;

$('#add').innerHTML=`<div class="pagehead"><h2>${t?'Edit trade #'+t.id:'New trade'}</h2><p>${queue&&t?'Bharna baaki: <b>'+(MISS(t).join(', ')||'sab bhara hai')+'</b> · queue me '+incN+' incomplete baaki':'Har field bharna zaroori nahi, par jitna bhara utna analysis pakka.'}</p></div>

['date','time','rr','pnl','risk','r','whatif','maxr','logic','mnote','note'].forEach(k=>{$('#f_'+k).value=v[k]??''});

const nb=[1,2,3,4].map(k=>({k:k<4?k+' trade'+(k>1?'s':'')+'/day':'4+ /day',...stats(Object.values(dm).filter(d=>k<4?d.length==k:d.length>=4).flat())})).filter(x=>x.n);

const mood=GN(a,'mood');const mBad=[...mood].sort((x,y)=>x.avg-y.avg)[0];const mGood=[...mood].sort((x,y)=>y.avg-x.avg)[0];

<div class="card"><h3>${IC.brain} Tilt meter: loss ke baad teri trading kaisi hoti hai</h3>${how('Har trade ko dekha jaata hai: us se theek pehle kitne loss lage the. Agar loss ke baad ke trades ka avg P&L win ke baad wale se girta hai, wo tilt hai — dimaag thanda nahi hua abhi.')}${tiltBars||'<p class="m">Data kam hai. Loss ke baad ke trades aur bharo.</p>'}

<div class="card"><h3>${IC.gauge} Rule discipline gauge</h3>${how('Score = 70% rule-followed% + 30% tilt-adjustment (tilt hai to kam). 80+ = achha, 60-79 = theek, 60 se neeche = discipline pe kaam kar.')}${score==null?'<p class="m">Rule checkbox abhi nahi bhara. Trade form me "Rule followed" tick karna shuru kar.</p>':gaugeSvg(score)+`<p class="m" style="text-align:center;margin:6px 0 0">Rule follow kiya: <b class="${rp>=80?'g':rp>=60?'y':'r'}">${rp.toFixed(0)}%</b> (${rl.filter(t=>t.rule=='Yes').length}/${rl.length} trades)${tilt?' · tilt penalty lag rahi hai':''}</p>`}${score!=null&&score<60?'<div class="ia" style="font-size:13.5px">👉 Kya karu: <b>Ek din me sirf 1-2 A+ setup, aur har trade se pehle checklist padh.</b></div>':''}</div>
<div class="card"><h3>${IC.clock} Overtrading: din me kitne trade</h3>${how('Har din ke trades gine jaake buckets me daala. Agar 4+ trade wale din ka avg P&L 1-trade wale din se kharab hai, zyada trading tera paisa kha rahi hai.')}${nb.length?bars(nb,'avg'):'<p class="m">Data kam hai.</p>'}
${overBad?`<p style="margin:10px 0 0;font-size:14.5px">1 trade/day ka avg <b class="${cl(b1d.avg)}">${fm(b1d.avg)}</b>, par 4+ trades/day ka avg <b class="${cl(b4d.avg)}">${fm(b4d.avg)}</b> (${b4d.n} trades). <b class="r">Overtrading tujhe mehngi pad rahi hai.</b></p><div class="ia" style="font-size:13.5px">👉 Kya karu: <b>Din ka max trade limit 3 likh le, aur limit ke baad platform band.</b></div>`:nb.length?'<p class="m">Zyada trade wale din me result kharab nahi dikh raha — limits kaam kar rahi hain.</p>':''}</div>

${mBad&&mBad.n>=3&&mBad.avg<0?`<p style="margin:10px 0 0;font-size:14.5px"><b>${esc(mBad.k)}</b> mood me tune <b>${mBad.n} trades</b> liye, avg <b class="r">${fm(mBad.avg)}</b> per trade${mGood&&mGood.k!=mBad.k?`, jabki <b>${esc(mGood.k)}</b> mood me avg <b class="g">${fm(mGood.avg)}</b>`:''}. <b class="r">Ye mood me entry lena band kar.</b></p><div class="ia" style="font-size:13.5px">👉 Kya karu: <b>Trade se pehle 30 second ruk ke pooch: "abhi mera mood kaunsa hai?" — ${esc(mBad.k)} ho to skip.</b></div>`:mGood&&mGood.n>=3&&mGood.avg>0?`<p style="margin:10px 0 0;font-size:14.5px">Tera best mood <b>${esc(mGood.k)}</b> hai: ${mGood.n} trades, avg <b class="g">${fm(mGood.avg)}</b>. Is mood me hi trade karna prioritize kar.</p>`:''}</div>
<div class="card"><h3>${IC.clock} Session & entry hour heat</h3>${how('Kis session aur kis ghante ki entry me tera result kaisa hai. Kharab ghante me entry lena kam kar.')}<div class="tiles" style="gap:12px">${tile(a,'session')}${tile(a,'hr')}</div></div>

async function openView(id){const t=S.trades.find(x=>x.id==id),s=await sget(id),L=(a,v)=>v?`<p style="white-space:pre-wrap;line-height:1.6;margin:6px 0"><b>${a}:</b> ${esc(v)}</p>`:'';
modal(`<h3>${t.date} · ${esc(t.pair)} · ${esc(t.account)} · <span class="${cl(t.pnl)}">${fm(t.pnl)}</span></h3><div class="chips" style="margin:8px 0 12px">${[t.session,t.dir,t.tf,t.style,t.mood].filter(Boolean).map(x=>`<span class="chip on2">${esc(x)}</span>`).join('')}</div>${L('Did',t.did)}${L('Strategy',(t.strat||[]).join(', '))}${L('HTF',(t.htf||[]).join(', '))}${L('Logic',t.logic)}${L('Mistake',t.mnote)}${L('Note',t.note)}${s.entry.length?'<h3>Entry</h3>'+s.entry.map(x=>`<img src="${x}">`).join(''):''}${s.result.length?'<h3>Result</h3>'+s.result.map(x=>`<img src="${x}">`).join(''):''}`)}
// ---------- editable dropdown lists
const LK=[['account','Account'],['pair','Pair'],['session','Session'],['dir','Direction'],['tf','Entry TF'],['did','What I did'],['quick','Quick view'],['bestalt','Best alternative'],['strat','Strategy'],['mistake','Mistake'],['style','Trading style']];let lk='pair';
function rLists(){return `<div class="card"><h3>${IC.edit} Edit dropdown lists</h3><select id="lk" style="max-width:240px">${LK.map(([k,l])=>`<option value="${k}" ${lk==k?'selected':''}>${l}</option>`).join('')}</select><div class="chips" style="margin:10px 0">${opts(lk).map(o=>`<span class="chip" data-r="${esc(o)}">${esc(o)} ✕</span>`).join('')}</div><div class="row"><input id="ln" placeholder="New option"><button class="btn" id="la">Add</button></div><p class="m">Removing hides it from the dropdown only; old trades keep their value.</p></div>`}
function lHand(){$('#lk').onchange=e=>{lk=e.target.value;rData()};document.querySelectorAll('[data-r]').forEach(c=>c.onclick=()=>{S.lists[lk]=opts(lk).filter(x=>x!=c.dataset.r);save();rData()});$('#la').onclick=()=>{const n=$('#ln').value.trim();if(n&&!opts(lk).includes(n)){S.lists[lk]=[...opts(lk),n];save();rData()}}}
// ---------- fix / merge tags
let fkey='quick';const FK=[['quick','Quick view'],['did','What I did'],['bestalt','Best alternative'],['pair','Pair'],['account','Account'],['session','Session'],['dir','Direction'],['tf','Entry TF'],['style','Trading style'],['strat','Strategy'],['mistake','Mistake']];
const tvals=k=>{const m={};S.trades.forEach(t=>(MULTI.includes(k)?(t[k]||[]):[t[k]]).forEach(v=>{if(v)m[v]=(m[v]||0)+1}));return Object.entries(m).sort((a,b)=>a[1]-b[1])};
function rFixTag(){return `<div class="card"><h3>${IC.edit} Tag me galti theek karo (rename / merge)</h3><p class="m" style="margin-top:0">Galat likha tag sab trades me ek saath sahi ho jaata hai. Do tag ko ek naam dene se wo merge bhi ho jaate hain. Kam use hue tag pehle dikhte hain, wahi aksar typo hote hain.</p><select id="ftk" style="max-width:240px">${FK.map(([k,l])=>`<option value="${k}" ${fkey==k?'selected':''}>${l}</option>`).join('')}</select><div class="chips" style="margin:11px 0">${tvals(fkey).map(([v,n])=>`<span class="chip" data-fv="${esc(v)}">${esc(v)} · ${n}</span>`).join('')||'<span class="m">Is field me abhi koi value nahi</span>'}</div><div class="row"><div><label>Galat tag (upar se chun)</label><input id="fto" readonly></div><div><label>Sahi tag (likh ya chun)</label><input id="ftn" list="ftl"></div><datalist id="ftl">${opts(fkey).map(o=>`<option>${esc(o)}</option>`).join('')}</datalist><div style="flex:0 0 auto"><button class="btn" id="ftb">Sab trades me badlo</button></div></div></div>`}
function fHand(){$('#ftk').onchange=e=>{fkey=e.target.value;rData()};document.querySelectorAll('[data-fv]').forEach(c=>c.onclick=()=>{$('#fto').value=c.dataset.fv;$('#ftn').focus()});
$('#ftb').onclick=()=>{const o=$('#fto').value,n=$('#ftn').value.trim(),k=fkey,M=MULTI.includes(k);if(!o||!n)return alert('Pehle galat tag chun aur sahi tag likh');if(o==n)return alert('Dono same hain');
const c=(tvals(k).find(x=>x[0]==o)||[0,0])[1];if(!confirm('"'+o+'" ko "'+n+'" me badlu? '+c+' trades me badlega.\nPehle Export everything kar liya?'))return;
S.trades.forEach(t=>{if(M){if((t[k]||[]).includes(o))t[k]=[...new Set(t[k].map(x=>x==o?n:x))]}else if(t[k]==o)t[k]=n});
if(S.lists[k]){const L2=S.lists[k].filter(x=>x!=o);if(!L2.includes(n))L2.push(n);S.lists[k]=L2}
save();toast(c+' trades theek ho gaye ✔');rData()}}
// ---------- demo data (in-memory only, never saved)
function demoTrades(){
 let s=987654321;const rnd=()=>{s=(s*1103515245+12345)>>>0;return s/4294967296};
 const pick=a=>a[Math.floor(rnd()*a.length)],w=a=>{let r=rnd()*a.reduce((x,y)=>x+y[1],0);for(const[v,p]of a){if((r-=p)<0)return v}return a[0][0]};
 const iso2=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 const T=[];let id=1,ls=0,ws=0;const today=new Date();
 const LOGICS=['HTF bullish + 15m structure break, entry on retest','London sweep ke baad reversal','NYSE open momentum, level se bounce','Range low se rejection, SL range high ke upar','Trend continuation, pullback EMA pe'];
 for(let i=88;i>=0&&T.length<46;i--){
  const d=new Date(today.getTime()-i*864e5);if(d.getDay()==0)continue;
  let n=Math.floor(rnd()*5.3);if(n>4)n=4;if(rnd()<.34)n=Math.min(n,1);
  for(let k=0;k<n&&T.length<46;k++){
   const pair=w([['XAUUSD',.5],['US30',.27],['BTC',.23]]);
   const account=rnd()<.7?'Funded':'Real';
   const session=w([['Asian',.25],['London',.4],['New York',.35]]);
   const hbase=session=='Asian'?2+rnd()*6:session=='London'?8+rnd()*4:13+rnd()*7;
   const hh=Math.floor(hbase),mm=Math.floor(rnd()*12)*5,ap=hh>=12?'pm':'am',h12=hh%12||12;
   const time=h12+':'+String(mm).padStart(2,'0')+' '+ap;
   const dir=rnd()<.52?'Buy':'Sell';
   const tf=w([['5m',.4],['15m',.35],['1h',.25]]);
   const wdir=dir=='Buy'?'Bullish':'Bearish';
   const htf=['15M','1H','4H','1D'].filter(()=>rnd()<.62).map(x=>x+' '+(rnd()<.55?wdir:w(['Bullish','Bearish','Sideways'])));
   const strat=[pick(DEF.strat)];if(rnd()<.28)strat.push(pick(DEF.strat));
   const rr=Math.round((1+rnd()*2)*2)/2;
   const risk=[40,50,60,75,100][Math.floor(rnd()*5)];
   let p=.52;
   if(ls>=2)p-=.14;if(ws>=3)p+=.05;
   const mood=ls>=2&&rnd()<.5?pick(['Revenge','FOMO']):w([['Calm',.3],['Focused',.24],['Confident',.14],['Hesitant',.08],['Tired',.08],['FOMO',.08],['Revenge',.05],['Greedy',.03]]);
   if(['FOMO','Revenge','Greedy'].includes(mood))p-=.13;else if(['Calm','Focused'].includes(mood))p+=.07;
   if(k>=3)p-=.12;
   if(strat.includes('Breakout'))p-=.07;if(strat.includes('Support zone')||strat.includes('Resistance zone'))p+=.07;
   if(pair=='XAUUSD'&&session=='London'&&strat.includes('Support zone'))p+=.18;
   if(pair=='US30'&&session=='Asian'&&strat.includes('Breakout'))p-=.18;
   let rule=(['Revenge','FOMO'].includes(mood)&&rnd()<.5)||rnd()<.14?'No':'Yes';
   if(rule=='No')p-=.09;
   const win=rnd()<p;
   let pnl,did,quick,maxr;
   if(rnd()<.05){pnl=0;did='C to C';quick='Immediate Loss';maxr=Math.round(rnd()*80)/100}
   else if(win){pnl=Math.round(risk*rr*(.6+rnd()*.7)*100)/100;did=pick(['TP hit','Trailed SL','Self book','Hold for more profit']);quick='Immediate Profit';maxr=Math.round(rr*(.8+rnd()*.6)*100)/100}
   else{pnl=-Math.round(risk*(.85+rnd()*.35)*100)/100;did=pick(['SL hit','C to C']);quick='Immediate Loss';maxr=rnd()<.18?Math.round((1.5+rnd()*1.3)*100)/100:Math.round(rnd()*90)/100}
   const r=Math.round(pnl/risk*100)/100;
   let bestalt='As planned',whatif=null;
   if(pnl<0&&rnd()<.62){bestalt=pick(['Hold original SL/TP','Remove TP + aggressive trail','Trail SL after recovery']);whatif=Math.round((pnl+(rnd()<.75?risk*(.4+rnd()*1.4):-risk*.5))*100)/100}
   else if(pnl>0&&rnd()<.4){bestalt='Hold for bigger profit';whatif=Math.round((pnl+(rnd()<.55?risk*(.2+rnd()*1.2):0))*100)/100}
   else if(rnd()<.4){whatif=Math.round((pnl+risk*.1)*100)/100}
   let mistake=[];
   if(pnl<0&&rnd()<.52)mistake=[pick(['Against levels','Ignored price action','Early exit','No setup','Revenge trade','Overtrade'])];
   else if(pnl>0&&rnd()<.12)mistake=['Early exit'];
   else if(rnd()<.16)mistake=['No mistake'];
   if(ls>=2&&rnd()<.5&&!mistake.includes('Revenge trade'))mistake.push('Revenge trade');
   const mnote=mistake.length&&rnd()<.4?'Next time is setup ko skip karna tha — patience ka issue hai.':'';
   if(rnd()<.09)rule='';
   if(rnd()<.1)quick='';
   T.push({id:id++,date:iso2(d),time,account,pair,session,dir,tf,htf,strat,rr,did,pnl,risk,r,quick,bestalt,whatif,maxr,mistake,mnote,rule,style:pick(DEF.style),logic:rnd()<.35?pick(LOGICS):'',note:'',mood});
   if(pnl>0){ws++;ls=0}else if(pnl<0){ls++;ws=0}else{ws=ls=0}
  }
 }
 return T}
