<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Journal</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#16181d;--mu:#6b7280;--bd:#e3e6ec;--ac:#2563eb;--g:#0f9d58;--r:#d93025;--y:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--tx:#e8eaf0;--mu:#8b93a3;--bd:#2a2f3a;--ac:#5b8cff;--g:#34c27a;--r:#ff6b60;--y:#e0b04a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:4px;padding:8px 10px;overflow-x:auto}
header b{margin-right:10px;align-self:center;white-space:nowrap}
.tab{border:0;background:none;color:var(--mu);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}.tab.on{background:var(--ac);color:#fff}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:7px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
textarea{min-height:56px;resize:vertical}
.btn{background:var(--ac);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer}.btn.s{background:var(--bd);color:var(--tx)}.btn.d{background:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{border:1px solid var(--bd);border-radius:99px;padding:3px 10px;cursor:pointer;background:var(--bg);font-size:12px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.kpi{padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}.kpi small{color:var(--mu);display:block;font-size:11px}.kpi b{font-size:18px}
.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:500;cursor:pointer}
.sc{overflow-x:auto}.bar{height:8px;border-radius:4px;min-width:2px}
.cal{display:flex;flex-wrap:wrap;gap:3px}.cd{width:26px;height:26px;border-radius:5px;font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff}
canvas{width:100%;height:220px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:120px}
.hide{display:none}.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--bd)}
.pz{min-height:90px;border:2px dashed var(--bd);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;outline:none;align-content:flex-start}.pz:focus,.pz.on{border-color:var(--ac)}.pz img{height:80px;border-radius:6px;cursor:zoom-in}.th{position:relative}.th b{position:absolute;top:2px;right:2px;background:var(--r);color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;cursor:pointer;font-size:12px}.ph{color:var(--mu);font-size:12px;width:100%}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;overflow:auto;padding:14px}.ov .in{max-width:1000px;margin:0 auto;background:var(--card);border-radius:12px;padding:14px}.ov img{width:100%;border-radius:8px;margin:6px 0}
</style></head><body>
<header><b>📈 Trading Journal</b><button class="tab on" data-t="add">➕ Trade</button><button class="tab" data-t="list">📋 Trades</button><button class="tab" data-t="ana">📊 Analysis</button><button class="tab" data-t="data">⚙️ Data &amp; Backup</button></header>
<main>
<section id="add"></section>
<section id="list" class="hide"></section>
<section id="ana" class="hide"></section>
<section id="data" class="hide"></section>
</main>
<script>
const SEED=[];
const KEY='tj_v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=['id','date','time','account','pair','session','dir','tf','htf','strat','rr','did','pnl','risk','r','quick','bestalt','whatif','maxr','mistake','mnote','rule','logic','note'];
const ARR=['htf','strat','mistake'],NUM=['rr','pnl','risk','r','whatif','maxr'],TFS=['5M','15M','1H','4H','1D'],BIAS=['Bullish','Bearish','Sideways'];
const DEF={account:['Funded','Real','Personal'],pair:['XAUUSD','BTC','US30','USTEC','XAGUSD'],session:['Asian','London','New York'],dir:['Buy','Sell'],tf:['1m','3m','5m','15m','1h'],did:['TP hit','SL hit','Trailed SL','C to C','Self book','Hold for more profit'],quick:['Immediate Profit','Immediate Loss'],bestalt:['As planned','Hold original SL/TP','Remove TP + aggressive trail','Book C to C','Trail SL after recovery','Hold for bigger profit','Book as per TP'],htf:['5m','15m','1h','4h','1d'],strat:['EMA','Market structure','Resistance zone','Support zone','Trendline','Price action','Breakout'],mistake:['No mistake','Against levels','Ignored price action','Revenge trade','Overtrade','Early exit','No setup']};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.trades)S={trades:SEED,url:'',t:0,last:{}};
S.lists=S.lists||{};let edit=null,tmr;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(tmr);if(S.url)tmr=setTimeout(()=>push(true),1500)}
function opts(k){if(S.lists[k])return S.lists[k];const s=new Set(DEF[k]||[]);S.trades.forEach(t=>(ARR.includes(k)?t[k]||[]:[t[k]]).forEach(v=>v&&s.add(v)));return[...s]}
const fm=v=>v==null||v===''?'–':(v<0?'-':'')+'$'+Math.abs(v).toFixed(2).replace(/\.00$/,''),cl=v=>v>0?'g':v<0?'r':'';
const out=t=>t.pnl>0?'Profit':t.pnl<0?'Loss':'Breakeven';
// ---------- tabs
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.t));
function show(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t==t));['add','list','ana','data'].forEach(s=>$('#'+s).classList.toggle('hide',s!=t));({add:rAdd,list:rList,ana:rAna,data:rData})[t]()}
// ---------- add / edit
let ch={};
function chips(k){return `<div class="chips" data-k="${k}">${opts(k).map(o=>`<span class="chip ${(ch[k]||[]).includes(o)?'on':''}">${esc(o)}</span>`).join('')}<span class="chip" data-add="1">+ new</span></div>`}
function inp(k,l,t='text'){return `<div><label>${l}</label><input id="f_${k}" type="${t}" ${t=='number'?'step="any"':''}${DEF[k]||['account','pair'].includes(k)?` list="dl_${k}"`:''}></div>`+(DEF[k]?`<datalist id="dl_${k}">${opts(k).map(o=>`<option>${esc(o)}</option>`).join('')}</datalist>`:'')}
function rAdd(){const t=edit?S.trades.find(x=>x.id==edit):null,L=S.last||{};
$('#add').innerHTML=`<div class="card"><h3>${t?'Edit trade #'+t.id:'New trade'}</h3><div class="grid">
${inp('date','Date','date')}${inp('time','Entry time')}${inp('account','Account')}${inp('pair','Pair')}${inp('session','Session')}${inp('dir','Direction')}${inp('tf','Entry TF')}${inp('rr','Planned RR (1:x → x)','number')}</div>
<div style="margin-top:8px"><label>HTF trend at entry (each timeframe)</label><div class="grid">${TFS.map(x=>`<div><label>${x}</label><select data-tf="${x}"><option value="">–</option>${BIAS.map(b=>`<option>${b}</option>`).join('')}</select></div>`).join('')}</div></div><div style="margin-top:8px"><label>Strategy</label>${chips('strat')}</div>
<div class="grid" style="margin-top:8px">${inp('did','What I did')}${inp('pnl','Actual P&amp;L ($)','number')}${inp('risk','Risk / SL size ($)','number')}${inp('r','Actual R (auto if risk filled)','number')}${inp('quick','Quick view')}${inp('bestalt','Best alternative')}${inp('whatif','What-if result ($)','number')}${inp('maxr','Max R price reached','number')}</div>
<div style="margin-top:8px"><label>Mistake</label>${chips('mistake')}</div>
<div class="grid" style="margin-top:8px"><div><label>Rule followed?</label><select id="f_rule"><option value="">–</option><option>Yes</option><option>No</option></select></div></div><div class="grid" style="margin-top:8px">${['entry','result'].map(k=>`<div><label>${k=='entry'?'Entry screenshots (1m + HTF)':'Exit / result screenshots'}: click box, then Ctrl+V</label><div class="pz" tabindex="0" data-z="${k}"></div></div>`).join('')}</div>
<div class="grid" style="margin-top:8px"><div><label>Logic / market view</label><textarea id="f_logic"></textarea></div><div><label>Mistake note / learning</label><textarea id="f_mnote"></textarea></div><div><label>Note</label><textarea id="f_note"></textarea></div></div>
<div class="row" style="margin-top:10px"><button class="btn" id="sv">${t?'Update':'Save trade'}</button>${t?'<button class="btn s" id="cn">Cancel</button>':''}</div></div>`;
const v=t||{date:new Date().toISOString().slice(0,10),account:L.account||'',pair:L.pair||'',tf:L.tf||'',session:'',htf:[],strat:L.strat||[],mistake:[]};
ch={htf:[...(v.htf||[])],strat:[...(v.strat||[])],mistake:[...(v.mistake||[])]};
F.forEach(k=>{const e=$('#f_'+k);if(e&&!ARR.includes(k))e.value=v[k]??''});
document.querySelectorAll('[data-tf]').forEach(s=>{const m=(v.htf||[]).find(x=>x.startsWith(s.dataset.tf+' '));s.value=m?m.split(' ')[1]:''});
shots={entry:[],result:[]};zone='entry';drawZ();if(t)sget(t.id).then(x=>{shots=x;drawZ()});
document.querySelectorAll('.pz').forEach(z=>{z.onfocus=z.onclick=()=>{zone=z.dataset.z;document.querySelectorAll('.pz').forEach(y=>y.classList.toggle('on',y==z))};z.ondragover=e=>e.preventDefault();z.ondrop=async e=>{e.preventDefault();zone=z.dataset.z;for(const f of e.dataTransfer.files)if(f.type.startsWith('image/'))shots[zone].push(await comp(f));drawZ()}});
document.querySelectorAll('#add .chips').forEach(c=>c.onclick=e=>{const k=c.dataset.k,s=e.target;if(!s.classList.contains('chip'))return;
if(s.dataset.add){const n=prompt('New option');if(n){S.lists[k]=[...opts(k),n.trim()];save();ch[k].push(n.trim());c.outerHTML=chips(k);rAddKeep()}return}
const x=s.textContent;ch[k]=ch[k].includes(x)?ch[k].filter(y=>y!=x):[...ch[k],x];s.classList.toggle('on')});
$('#sv').onclick=()=>{const o={id:t?t.id:Math.max(0,...S.trades.map(x=>x.id))+1};F.forEach(k=>{if(k=='id')return;const e=$('#f_'+k);o[k]=ARR.includes(k)?ch[k]:NUM.includes(k)?(e.value===''?null:+e.value):e.value.trim()});
o.htf=[...(ch.htf||[]).filter(x=>!/ (Bullish|Bearish|Sideways)$/.test(x)),...[...document.querySelectorAll('[data-tf]')].filter(s=>s.value).map(s=>s.dataset.tf+' '+s.value)];
if(!o.date||o.pnl==null){alert('Date and P&L are required');return}
if(o.risk>0&&o.r==null)o.r=Math.round(o.pnl/o.risk*100)/100;
['account','pair','session','dir','tf','did','quick','bestalt'].forEach(k=>{if(o[k]&&S.lists[k]&&!S.lists[k].includes(o[k]))S.lists[k].push(o[k])});
if(t)Object.assign(t,o);else S.trades.push(o);S.last={account:o.account,pair:o.pair,tf:o.tf,strat:o.strat};sput(o.id,shots);edit=null;save();show('list')};
if($('#cn'))$('#cn').onclick=()=>{edit=null;rAdd()}}
function rAddKeep(){document.querySelectorAll('#add .chips').forEach(c=>c.replaceWith(c))}
// ---------- list
let sortK='date',sortD=-1,q='';
function rList(){const rows=S.trades.filter(t=>!q||JSON.stringify(t).toLowerCase().includes(q)).sort((a,b)=>(a[sortK]>b[sortK]?1:-1)*sortD||b.id-a.id);
const cols=[['date','Date'],['account','Acc'],['pair','Pair'],['tf','TF'],['strat','Strategy'],['rr','RR'],['did','Did'],['pnl','P&L'],['rule','Rule']];
$('#list').innerHTML=`<div class="card"><div class="row"><input id="q" placeholder="Search..." value="${esc(q)}"><span class="m">${rows.length} trades · net <b class="${cl(rows.reduce((a,t)=>a+t.pnl,0))}">${fm(rows.reduce((a,t)=>a+t.pnl,0))}</b></span></div></div>
<div class="card sc"><table><tr>${cols.map(c=>`<th data-k="${c[0]}">${c[1]}${sortK==c[0]?(sortD>0?' ▲':' ▼'):''}</th>`).join('')}<th></th></tr>${rows.map(t=>`<tr title="${esc(t.mnote||t.logic)}"><td>${t.date}</td><td>${esc(t.account)}</td><td>${esc(t.pair)}</td><td>${esc(t.tf)}</td><td>${esc((t.strat||[]).join(', '))}</td><td>${t.rr??'–'}</td><td>${esc(t.did)}</td><td class="${cl(t.pnl)}">${fm(t.pnl)}</td><td>${t.rule=='Yes'?'✔':t.rule=='No'?'✘':''}</td><td><button class="btn s" data-v="${t.id}">View</button> <button class="btn s" data-e="${t.id}">Edit</button> <button class="btn s" data-x="${t.id}">✕</button></td></tr>`).join('')}</table></div>`;
$('#q').oninput=e=>{q=e.target.value.toLowerCase();rList();$('#q').focus()};
document.querySelectorAll('#list th[data-k]').forEach(h=>h.onclick=()=>{sortD=sortK==h.dataset.k?-sortD:-1;sortK=h.dataset.k;rList()});
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>openView(+b.dataset.v));
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{edit=b.dataset.e;show('add')});
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(confirm('Delete this trade?')){S.trades=S.trades.filter(t=>t.id!=b.dataset.x);save();rList()}})}
// ---------- analysis
let flt={account:'',pair:'',from:'',to:''},dim='strat';
function stats(a){const n=a.length,w=a.filter(t=>t.pnl>0),l=a.filter(t=>t.pnl<0),gw=w.reduce((s,t)=>s+t.pnl,0),gl=-l.reduce((s,t)=>s+t.pnl,0),pnl=gw-gl;
let eq=0,pk=0,dd=0,ms=0,ml=0,cw=0,cL=0;[...a].sort((x,y)=>x.date>y.date?1:x.date<y.date?-1:x.id-y.id).forEach(t=>{eq+=t.pnl;pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq);if(t.pnl>0){cw++;cL=0}else if(t.pnl<0){cL++;cw=0}else{cw=cL=0}ms=Math.max(ms,cw);ml=Math.max(ml,cL)});
const rs=a.filter(t=>t.r!=null);return{n,w:w.length,l:l.length,be:n-w.length-l.length,pnl,gw,gl,wr:n?w.length/n*100:0,pf:gl?gw/gl:gw?99:0,avg:n?pnl/n:0,aw:w.length?gw/w.length:0,al:l.length?-gl/l.length:0,dd,ms,ml,ar:rs.length?rs.reduce((s,t)=>s+t.r,0)/rs.length:null}}
const hr=t=>{const m=/(\d+):(\d+)\s*(am|pm)?/i.exec(t.time||'');if(!m)return null;let h=+m[1];if(m[3]&&m[3].toLowerCase()=='pm'&&h<12)h+=12;if(!m[3]&&h<12&&h>=5)h+=12;return h%24};
const DIMS={account:['Account',t=>[t.account]],pair:['Pair',t=>[t.pair]],strat:['Strategy',t=>t.strat],htf:['HTF confirmation',t=>t.htf],tf:['Entry TF',t=>[t.tf]],session:['Session',t=>[t.session]],dir:['Direction',t=>[t.dir]],did:['What I did',t=>[t.did]],quick:['Quick view',t=>[t.quick]],mistake:['Mistake',t=>t.mistake],rule:['Rule followed',t=>[t.rule]],rr:['Planned RR',t=>[t.rr!=null?'1:'+Math.round(t.rr*2)/2:'']],wd:['Weekday',t=>['Sun Mon Tue Wed Thu Fri Sat'.split(' ')[new Date(t.date).getDay()]]],mo:['Month',t=>[t.date.slice(0,7)]],maxr:['Max R reached',t=>[t.maxr==null?'':t.maxr<1?'<1R':t.maxr<2?'1-2R':t.maxr<3?'2-3R':'3R+']],htfa:['HTF trend alignment',t=>{if(!t.dir)return[''];const w=t.dir=='Buy'?'Bullish':'Bearish',o=w=='Bullish'?'Bearish':'Bullish',x=(t.htf||[]).filter(h=>/ (Bullish|Bearish|Sideways)$/.test(h));if(!x.length)return[''];return[x.filter(h=>h.endsWith(w)).length+' with / '+x.filter(h=>h.endsWith(o)).length+' against']}],hr:['Entry hour',t=>[hr(t)==null?'':hr(t)+':00']]};
function grp(a,f){const m={};a.forEach(t=>(f(t)||[]).forEach(k=>{k=k||'(blank)';(m[k]=m[k]||[]).push(t)}));return Object.entries(m).map(([k,v])=>({k,...stats(v)})).sort((x,y)=>y.pnl-x.pnl)}
function tbl(rows){const mx=Math.max(1,...rows.map(r=>Math.abs(r.pnl)));return `<div class="sc"><table><tr><th>Name</th><th>Trades</th><th>Win%</th><th>P&amp;L</th><th></th><th>Avg</th><th>PF</th></tr>${rows.map(r=>`<tr><td>${esc(r.k)}</td><td>${r.n}</td><td>${r.wr.toFixed(0)}%</td><td class="${cl(r.pnl)}">${fm(r.pnl)}</td><td style="width:90px"><div class="bar" style="width:${Math.abs(r.pnl)/mx*80}px;background:var(--${r.pnl>=0?'g':'r'})"></div></td><td>${fm(r.avg)}</td><td>${r.pf.toFixed(2)}</td></tr>`).join('')}</table></div>`}
function rAna(){const a=S.trades.filter(t=>(!flt.account||t.account==flt.account)&&(!flt.pair||t.pair==flt.pair)&&(!flt.from||t.date>=flt.from)&&(!flt.to||t.date<=flt.to)),s=stats(a);
const sel=(k,l)=>`<div><label>${l}</label><select data-f="${k}"><option value="">All</option>${opts(k).map(o=>`<option ${flt[k]==o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
const K=(l,v,c='')=>`<div class="kpi"><small>${l}</small><b class="${c}">${v}</b></div>`;
const sorted=[...a].sort((x,y)=>x.date>y.date?1:x.date<y.date?-1:x.id-y.id);
// after-loss
const al=[0,1,2,3].map(k=>{const r=[];let c=0;sorted.forEach(t=>{if(c==k)r.push(t);c=t.pnl<0?c+1:0});return{k:k?'After '+k+' loss'+(k>1?'es':'')+(k==3?'+':''):'After win/start',...stats(r)}}).filter(x=>x.n);
const days={};a.forEach(t=>(days[t.date]=days[t.date]||[]).push(t));const tpd=Object.values(days);
const nb=[1,2,3,4].map(k=>{const r=tpd.filter(d=>k<4?d.length==k:d.length>=4).flat();return{k:k<4?k+' trade'+(k>1?'s':'')+'/day':'4+/day',...stats(r)}}).filter(x=>x.n);
const wi=a.filter(t=>t.whatif!=null),wis=wi.reduce((x,t)=>x+t.whatif,0),wia=wi.reduce((x,t)=>x+t.pnl,0);
const rf=grp(a,t=>[t.rule||'(blank)']);
$('#ana').innerHTML=`<div class="card"><div class="row">${sel('account','Account')}${sel('pair','Pair')}<div><label>From</label><input type="date" data-f="from" value="${flt.from}"></div><div><label>To</label><input type="date" data-f="to" value="${flt.to}"></div></div></div>
<div class="grid" style="margin-bottom:12px">${K('Net P&L',fm(s.pnl),cl(s.pnl))}${K('Trades',s.n)}${K('Win rate',s.wr.toFixed(1)+'%')}${K('Profit factor',s.pf.toFixed(2))}${K('Expectancy / trade',fm(s.avg),cl(s.avg))}${K('Avg win',fm(s.aw),'g')}${K('Avg loss',fm(s.al),'r')}${K('Win : Loss (W/L/BE)',s.w+' / '+s.l+' / '+s.be)}${K('Max drawdown',fm(-s.dd),'r')}${K('Max win streak',s.ms)}${K('Max loss streak',s.ml)}${K('Avg R',s.ar==null?'–':s.ar.toFixed(2))}</div>
<div class="card"><h3>Equity curve</h3><canvas id="eq"></canvas></div>
<div class="card"><div class="row"><h3 style="flex:2">Breakdown by</h3><select id="dim">${Object.entries(DIMS).map(([k,v])=>`<option value="${k}" ${dim==k?'selected':''}>${v[0]}</option>`).join('')}</select></div>${tbl(grp(a,DIMS[dim][1]))}</div>
<div class="card"><h3>Exit study: what I did vs what-if</h3>${tbl(grp(a,DIMS.did[1]))}${wi.length?`<p class="m">${wi.length} trades have a what-if value: actual <b class="${cl(wia)}">${fm(wia)}</b> vs what-if <b class="${cl(wis)}">${fm(wis)}</b> → difference <b class="${cl(wis-wia)}">${fm(wis-wia)}</b></p>`:'<p class="m">Fill “What-if result ($)” on trades to compare trail / early exit with the plan.</p>'}</div>
<div class="card"><h3>Behaviour: next trade after losses</h3>${tbl(al)}<h3 style="margin-top:12px">Overtrading: trades per day</h3>${tbl(nb)}<h3 style="margin-top:12px">Rule followed vs broken</h3>${tbl(rf)}</div>
<div class="card"><h3>Calendar (daily P&amp;L)</h3><div id="cal"></div></div>`;
document.querySelectorAll('#ana [data-f]').forEach(e=>e.onchange=()=>{flt[e.dataset.f]=e.value;rAna()});$('#dim').onchange=e=>{dim=e.target.value;rAna()};
// calendar
const mo={};Object.entries(days).forEach(([d,v])=>{(mo[d.slice(0,7)]=mo[d.slice(0,7)]||[]).push([d,v.reduce((x,t)=>x+t.pnl,0)])});
const mxd=Math.max(1,...Object.values(days).map(v=>Math.abs(v.reduce((x,t)=>x+t.pnl,0))));
$('#cal').innerHTML=Object.keys(mo).sort().map(m=>`<div style="margin-bottom:8px"><label>${m} · ${fm(mo[m].reduce((x,y)=>x+y[1],0))}</label><div class="cal">${mo[m].sort().map(([d,p])=>`<div class="cd" title="${d}: ${fm(p)}" style="background:${p>0?'var(--g)':p<0?'var(--r)':'var(--mu)'};opacity:${.35+.65*Math.abs(p)/mxd}">${+d.slice(8)}</div>`).join('')}</div></div>`).join('');
// equity
const c=$('#eq'),x=c.getContext('2d'),W=c.width=c.clientWidth*2,H=c.height=440;let e=0;const pts=sorted.map(t=>e+=t.pnl);
if(pts.length){const mn=Math.min(0,...pts),mx2=Math.max(0,...pts),sy=v=>H-30-(v-mn)/((mx2-mn)||1)*(H-60),sx=i=>20+i/Math.max(1,pts.length-1)*(W-40),st=getComputedStyle(document.body);
x.strokeStyle=st.getPropertyValue('--bd');x.lineWidth=2;x.beginPath();x.moveTo(0,sy(0));x.lineTo(W,sy(0));x.stroke();x.strokeStyle=st.getPropertyValue('--ac');x.lineWidth=3;x.beginPath();pts.forEach((v,i)=>i?x.lineTo(sx(i),sy(v)):x.moveTo(sx(i),sy(v)));x.stroke();
x.fillStyle=st.getPropertyValue('--mu');x.font='24px sans-serif';x.fillText(fm(mx2),24,22);x.fillText(fm(mn),24,H-6)}}
// ---------- data / backup
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return F.join(',')+'\n'+S.trades.map(t=>F.map(k=>q(ARR.includes(k)?(t[k]||[]).join('|'):t[k])).join(',')).join('\n')}
function parseCsv(s){const r=[];let row=[],f='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c=='"'){if(s[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&s[i+1]=='\n')i++;row.push(f);f='';if(row.length>1||row[0])r.push(row);row=[]}else f+=c}if(f||row.length){row.push(f);r.push(row)}return r}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
async function push(q){const el=$('#st');try{await fetch(S.url,{method:'POST',mode:'no-cors',body:JSON.stringify({trades:S.trades,fields:F})});S.t=Date.now();localStorage.setItem(KEY,JSON.stringify(S));if(el)el.textContent='✔ Sheet backup sent '+new Date().toLocaleTimeString()}catch(e){if(el)el.textContent='✘ Backup failed (offline?). Data is safe in this browser.'}}
function rData(){$('#data').innerHTML=`<div class="card"><h3>Backup to Google Sheet (automatic)</h3><p class="m">Paste your Apps Script Web App URL once. After that every save is sent to your Sheet automatically.</p><div class="row"><input id="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(S.url)}"><button class="btn" id="su">Save URL</button><button class="btn s" id="pn">Backup now</button><button class="btn s" id="rs">Restore from Sheet</button></div><p id="st" class="m">${S.t?'Last backup: '+new Date(S.t).toLocaleString():'Not backed up yet'}</p></div>
<div class="card"><h3>Excel / CSV</h3><div class="row"><button class="btn" id="ex">Export CSV (opens in Excel)</button><button class="btn s" id="ej">Export everything (with screenshots)</button><div><label>Import CSV / JSON (replaces all data)</label><input type="file" id="im" accept=".csv,.json"></div></div><p class="m">Total trades stored: ${S.trades.length}. Export now and then as an extra safety copy.</p></div>
${rLists()}<div class="card"><h3>Danger zone</h3><button class="btn d" id="wp">Delete all trades</button></div>`;
$('#su').onclick=()=>{S.url=$('#url').value.trim();save();alert('Saved')};$('#pn').onclick=()=>{if(!S.url)return alert('Add the URL first');push()};
$('#rs').onclick=async()=>{if(!S.url||!confirm('Replace local data with the Sheet data?'))return;try{const j=await(await fetch(S.url)).json();if(j.trades){S.trades=j.trades;save();alert('Restored '+j.trades.length+' trades');rData()}}catch(e){alert('Could not read the Sheet')}};
$('#ex').onclick=()=>dl('trading-journal.csv','\ufeff'+csv(),'text/csv');$('#ej').onclick=async()=>{const sh={};for(const x of S.trades){const v=await sget(x.id);if(v.entry.length||v.result.length)sh[x.id]=v}dl('trading-journal-full.json',JSON.stringify({trades:S.trades,shots:sh}),'application/json')};lHand();
$('#wp').onclick=()=>{if(confirm('Delete ALL trades? Export first!')){S.trades=[];save();rData()}};
$('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{let t,sh={};if(f.name.endsWith('.json')){t=JSON.parse(rd.result);if(!Array.isArray(t)){sh=t.shots||{};t=t.trades}}else{const r=parseCsv(rd.result.replace(/^\ufeff/,'')),h=r[0];t=r.slice(1).map(c=>{const o={};h.forEach((k,i)=>{const v=c[i];o[k]=ARR.includes(k)?(v?v.split('|'):[]):NUM.includes(k)||k=='id'?(v===''||v==null?null:+v):v});return o})}
if(!confirm('Replace current '+S.trades.length+' trades with '+t.length+' imported trades?'))return;S.trades=t.map((o,i)=>({...o,id:o.id||i+1}));Object.entries(sh).forEach(([i,v])=>sput(+i,v));save();alert('Imported '+t.length);rData()}catch(x){alert('Import failed: '+x.message)}};rd.readAsText(f)}}
// ---------- screenshots
let shots={entry:[],result:[]},zone='entry',dbp;
const idb=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('tj_shots',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}));
const E0=()=>({entry:[],result:[]});
const sget=async id=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction('s').objectStore('s').get(id);q.onsuccess=()=>r(q.result||E0());q.onerror=()=>r(E0())})}catch(e){return E0()}};
const sput=async(id,v)=>{try{const d=await idb();d.transaction('s','readwrite').objectStore('s').put(v,id)}catch(e){}};
const comp=f=>new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1100/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};i.src=URL.createObjectURL(f)});
function drawZ(){document.querySelectorAll('.pz').forEach(z=>{const k=z.dataset.z;z.innerHTML=shots[k].length?shots[k].map((s,i)=>`<span class="th"><img src="${s}" data-i="${i}"><b data-d="${i}">×</b></span>`).join(''):'<div class="ph">Paste (Ctrl+V) or drop screenshots here</div>';
z.querySelectorAll('img').forEach(m=>m.onclick=e=>{e.stopPropagation();modal(`<img src="${m.src}">`)});z.querySelectorAll('b').forEach(b=>b.onclick=e=>{e.stopPropagation();shots[k].splice(+b.dataset.d,1);drawZ()})})}
document.addEventListener('paste',async e=>{if($('#add').classList.contains('hide'))return;const fs=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile());if(!fs.length)return;e.preventDefault();for(const f of fs)shots[zone].push(await comp(f));drawZ()});
function modal(h){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="in"><button class="btn s" style="float:right">Close ✕</button>${h}</div>`;o.onclick=e=>{if(e.target==o||e.target.tagName=='BUTTON')o.remove()};document.body.appendChild(o)}
async function openView(id){const t=S.trades.find(x=>x.id==id),s=await sget(id),L=(a,v)=>v?`<p><b>${a}:</b> ${esc(v)}</p>`:'';
modal(`<h3>${t.date} · ${esc(t.pair)} · ${esc(t.account)} · <span class="${cl(t.pnl)}">${fm(t.pnl)}</span></h3>${L('Did',t.did)}${L('Strategy',(t.strat||[]).join(', '))}${L('HTF',(t.htf||[]).join(', '))}${L('Logic',t.logic)}${L('Mistake',t.mnote)}${L('Note',t.note)}${s.entry.length?'<h3>Entry</h3>'+s.entry.map(x=>`<img src="${x}">`).join(''):''}${s.result.length?'<h3>Result</h3>'+s.result.map(x=>`<img src="${x}">`).join(''):''}`)}
// ---------- editable dropdown lists
const LK=[['account','Account'],['pair','Pair'],['session','Session'],['dir','Direction'],['tf','Entry TF'],['did','What I did'],['quick','Quick view'],['bestalt','Best alternative'],['strat','Strategy'],['mistake','Mistake']];let lk='pair';
function rLists(){return `<div class="card"><h3>Edit dropdown lists</h3><select id="lk">${LK.map(([k,l])=>`<option value="${k}" ${lk==k?'selected':''}>${l}</option>`).join('')}</select><div class="chips" style="margin:8px 0">${opts(lk).map(o=>`<span class="chip" data-r="${esc(o)}">${esc(o)} ✕</span>`).join('')}</div><div class="row"><input id="ln" placeholder="New option"><button class="btn" id="la">Add</button></div><p class="m">Removing hides it from the dropdown only; old trades keep their value.</p></div>`}
function lHand(){$('#lk').onchange=e=>{lk=e.target.value;rData()};document.querySelectorAll('[data-r]').forEach(c=>c.onclick=()=>{S.lists[lk]=opts(lk).filter(x=>x!=c.dataset.r);save();rData()});$('#la').onclick=()=>{const n=$('#ln').value.trim();if(n&&!opts(lk).includes(n)){S.lists[lk]=[...opts(lk),n];save();rData()}}}
rAdd();
</script></body></html>
